name: Auto Release on VERSION Change

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Read and validate VERSION file
        id: version
        run: |
          NEW_VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

          if [[ ! "${NEW_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION file contains '${NEW_VERSION}', which is not valid semver (expected X.Y.Z)"
            exit 1
          fi

          echo "VERSION file contains valid semver: ${NEW_VERSION}"

      - name: Get latest existing tag
        id: latest_tag
        run: |
          # Get all version tags, sort by semver, take the latest
          LATEST_TAG=$(git tag --list 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)

          if [ -z "${LATEST_TAG}" ]; then
            echo "No existing version tags found"
            echo "latest_version=" >> "$GITHUB_OUTPUT"
          else
            echo "Latest existing tag: v${LATEST_TAG}"
            echo "latest_version=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare versions
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          LATEST_VERSION="${{ steps.latest_tag.outputs.latest_version }}"

          # If no previous tags exist, any valid version is acceptable
          if [ -z "${LATEST_VERSION}" ]; then
            echo "No previous version tags found. v${NEW_VERSION} will be the first release."
            exit 0
          fi

          echo "Comparing new version ${NEW_VERSION} against latest tag v${LATEST_VERSION}"

          # Split versions into components
          IFS='.' read -r NEW_MAJOR NEW_MINOR NEW_PATCH <<< "${NEW_VERSION}"
          IFS='.' read -r OLD_MAJOR OLD_MINOR OLD_PATCH <<< "${LATEST_VERSION}"

          # Compare major.minor.patch numerically
          if [ "${NEW_MAJOR}" -gt "${OLD_MAJOR}" ]; then
            echo "Major version bump: ${OLD_MAJOR} -> ${NEW_MAJOR}"
            exit 0
          elif [ "${NEW_MAJOR}" -lt "${OLD_MAJOR}" ]; then
            echo "::error::New version ${NEW_VERSION} has a lower major version than latest tag v${LATEST_VERSION}"
            exit 1
          fi

          if [ "${NEW_MINOR}" -gt "${OLD_MINOR}" ]; then
            echo "Minor version bump: ${OLD_MINOR} -> ${NEW_MINOR}"
            exit 0
          elif [ "${NEW_MINOR}" -lt "${OLD_MINOR}" ]; then
            echo "::error::New version ${NEW_VERSION} has a lower minor version than latest tag v${LATEST_VERSION}"
            exit 1
          fi

          if [ "${NEW_PATCH}" -gt "${OLD_PATCH}" ]; then
            echo "Patch version bump: ${OLD_PATCH} -> ${NEW_PATCH}"
            exit 0
          elif [ "${NEW_PATCH}" -lt "${OLD_PATCH}" ]; then
            echo "::error::New version ${NEW_VERSION} has a lower patch version than latest tag v${LATEST_VERSION}"
            exit 1
          fi

          echo "::error::New version ${NEW_VERSION} is the same as latest tag v${LATEST_VERSION}. Version must be strictly greater."
          exit 1

      - name: Create and push tag
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          TAG="v${NEW_VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

          echo "Successfully created and pushed tag ${TAG}"
          echo "This will trigger the release pipeline."
