name: Release Haystack

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Run tests
        working-directory: ./src
        run: go test ./...

      - name: Run build.go
        working-directory: ./src
        run: go run build.go

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Create and upload to GitHub Release
        run: |
          # Authenticate with GitHub CLI
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

          # Create the release
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes

          # Upload artifacts
          gh release upload "${{ github.ref_name }}" src/dist/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
