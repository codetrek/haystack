name: Release Haystack

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Run tests
        run: go test ./...

      - name: Run build.go
        run: go run build.go

      - name: Create and upload to GitHub Release
        run: |
          # Create the release
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes

          # Upload artifacts
          gh release upload "${{ github.ref_name }}" dist/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
