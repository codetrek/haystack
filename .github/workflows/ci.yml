name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # The cross-platform matrix exists for core's platform-sensitive code
  # (its mmap'd vectorstore). core is its own module, so build and test it
  # from there on every OS. On Linux, go-cov runs the suite and enforces the
  # coverage bar; macOS/Windows run the suite as a portability check.
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # core/tokenizer/fstcjk/dict.fst is a Git LFS object that go:embed
          # compiles into the binary; without lfs the working tree holds the
          # ~130B pointer and the embedded FST is silently corrupt.
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Pin to go.mod's toolchain version. go-version-file would install the
          # `go` directive (1.23.0) and then trigger a second toolchain download
          # (go1.24.2) at build time — slow, especially on Windows (NTFS + AV).
          # Keep this in sync with the `toolchain` line in go.mod.
          go-version: '1.24.2'
          # Caches both the module cache and the build cache, with correct
          # per-OS paths — so no separate actions/cache step is needed.
          cache: true

      - name: Verify Go version
        run: go version

      - name: Build
        working-directory: core
        run: go build ./...

      - name: Coverage gate (Linux)
        # go-cov runs core's full suite and enforces the same bar as the
        # core module.
        if: matrix.os == 'ubuntu-latest'
        working-directory: core
        run: go run github.com/codetreker/go-cov/cmd/go-cov@v0.1.2

      - name: Test (macOS/Windows)
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        working-directory: core
        run: |
          # -v prints each case's execution time. Show only result lines, and
          # drop the 0.00s cases (noise) — keep all FAILs and the full log on
          # failure (with assertion detail).
          # -short trims the iteration count of the loop-heavy merge race tests:
          # each store lifecycle pays a heavy FS/AV tax on the Windows runner, and
          # those tests' deterministic seams already exercise the race per-iteration.
          # Linux runs the FULL suite (no -short) via the coverage gate above.
          set -o pipefail
          go test -short -v -timeout 15m ./... 2>&1 | tee vitest.log \
            | grep -E '^(ok|FAIL|--- (PASS|FAIL):|panic:)' | grep -vE '^--- PASS:.*\(0\.00s\)$'
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then echo "===== full test log ====="; cat vitest.log; fi
          rm -f vitest.log
          exit "$status"

  # The app module (the haystack server) is Linux-targeted, so build, test, and
  # gate its coverage on Linux only. Formatting is a repo-wide check and lives
  # here since this is the single Linux job.
  app:
    name: App (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # See the core job: pin to go.mod's toolchain version to avoid a
          # redundant SDK install. Keep in sync with the `toolchain` line.
          go-version: '1.24.2'
          cache: true

      - name: Verify Go version
        run: go version

      - name: Check Formatting
        # Repo-wide gofmt check; covers both the root and core modules.
        run: ./.github/workflows/scripts/check-fmt.sh

      - name: Build
        run: go build ./...

      - name: Test and Coverage
        run: ./.github/workflows/scripts/test_and_coverage.sh
