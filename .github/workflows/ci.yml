name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Git LFS
        if: matrix.os == 'ubuntu-latest'
        run: |
          git lfs install
          git lfs pull

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', '**/*.go') }}
          restore-keys: |
            go-build-${{ runner.os }}-

      - name: Verify Go version
        run: go version

      - name: Check Formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./.github/workflows/scripts/check-fmt.sh

      - name: Build
        run: go build ./...

      - name: Test and Coverage (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./.github/workflows/scripts/test_and_coverage.sh

      - name: Test (macOS/Windows)
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: |
          # -v prints each case's execution time. Show only result lines, and
          # drop the 0.00s cases (noise) — keep all FAILs and the full log on
          # failure (with assertion detail).
          set -o pipefail
          go test -v -timeout 15m ./internal/core/vectorindex/... 2>&1 | tee vitest.log \
            | grep -E '^(ok|FAIL|--- (PASS|FAIL):|panic:)' | grep -vE '^--- PASS:.*\(0\.00s\)$'
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then echo "===== full test log ====="; cat vitest.log; fi
          rm -f vitest.log
          exit "$status"

      # TEMPORARY (investigation, do not merge): end-to-end A/B of the
      # 4-accumulator dot kernel (this branch) vs origin/main's single-
      # accumulator kernel, on real Apple Silicon, back-to-back on the same
      # runner. Shows whether the kernel speedup translates to HNSW
      # insert/search (dim=128). Strip before merge.
      - name: Dot kernel end-to-end A/B (Apple Silicon)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -e
          git fetch --depth=1 origin main
          run() { go test -tags=benchmark -run '^$' \
            -bench '^(BenchmarkHNSWInsert|BenchmarkHNSWSearch)$' \
            -benchmem -count=12 -benchtime=200ms -timeout 20m \
            ./internal/core/vectorindex/; }
          echo '##### NEW: 4-accumulator kernel (this branch) #####'
          run | tee /tmp/new.txt
          echo '##### OLD: 1-accumulator kernel (origin/main) #####'
          git checkout FETCH_HEAD -- internal/core/vectorindex/dot_arm64.s internal/core/vectorindex/dot_arm64.go
          run | tee /tmp/old.txt
          git checkout HEAD -- internal/core/vectorindex/dot_arm64.s internal/core/vectorindex/dot_arm64.go
          echo '##### PAIRED (old | new) #####'
          paste <(grep -E '^Benchmark' /tmp/old.txt) <(grep -E '^Benchmark' /tmp/new.txt) || true

  searchcore-coverage:
    name: Coverage (searchcore)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: go-cov (searchcore)
        # searchcore has its own go.mod, so the main gate's `go test ./...` never
        # reaches it. Run go-cov inside the module at the same bar as the main
        # module (func 80 / package 85 / total 90).
        working-directory: searchcore
        env:
          THRESHOLD_FUNC: "80"
          THRESHOLD_PACKAGE: "85"
          THRESHOLD_PRINT: "85"
          THRESHOLD_TOTAL: "90"
        run: go run github.com/codetreker/go-cov/cmd/go-cov@v0.1.1

