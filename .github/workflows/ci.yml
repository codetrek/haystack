name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Git LFS
        if: matrix.os == 'ubuntu-latest'
        run: |
          git lfs install
          git lfs pull

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', '**/*.go') }}
          restore-keys: |
            go-build-${{ runner.os }}-

      - name: Verify Go version
        run: go version

      - name: Check Formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./.github/workflows/scripts/check-fmt.sh

      - name: Build
        run: go build ./...

      - name: Test and Coverage (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./.github/workflows/scripts/test_and_coverage.sh

      - name: Test (macOS/Windows)
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: |
          set -x
          echo "RESULT OS=${{ runner.os }}"
          echo "=== cache state (was the Go build cache restored on this OS?) ==="
          go env GOCACHE GOMODCACHE
          CACHE=$(go env GOCACHE)
          du -sh "$CACHE" 2>/dev/null || echo "RESULT cache_dir_missing_or_unreadable"
          echo "=== STEP 1: compile+link the vectorindex test binary ==="
          t0=$(date +%s); go test -c -o vitest_bin ./internal/core/vectorindex/ ; t1=$(date +%s)
          echo "RESULT COMPILE=$((t1-t0))s"
          echo "=== STEP 2: run ALL (binary now cached → ~pure execution) ==="
          t0=$(date +%s); go test -count=1 ./internal/core/vectorindex/ ; t1=$(date +%s)
          echo "RESULT RUN_ALL=$((t1-t0))s"
          echo "=== STEP 3: run WITHOUT fault/crash/WAL tests ==="
          t0=$(date +%s); go test -count=1 -skip 'Error|Fault|Crash|Kill9|Recovery|Replay|WAL|Checkpoint|Idmap' ./internal/core/vectorindex/ ; t1=$(date +%s)
          echo "RESULT RUN_NO_FAULT=$((t1-t0))s"
          echo "=== STEP 4: run ONLY fault/crash/WAL tests (the 55 added ones live here) ==="
          t0=$(date +%s); go test -count=1 -run 'Error|Fault|Crash|Kill9|Recovery|Replay|WAL|Checkpoint|Idmap' ./internal/core/vectorindex/ ; t1=$(date +%s)
          echo "RESULT RUN_ONLY_FAULT=$((t1-t0))s"
