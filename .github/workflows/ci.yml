name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Git LFS
        if: matrix.os == 'ubuntu-latest'
        run: |
          git lfs install
          git lfs pull

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', '**/*.go') }}
          restore-keys: |
            go-build-${{ runner.os }}-

      - name: Verify Go version
        run: go version

      - name: Check Formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./.github/workflows/scripts/check-fmt.sh

      - name: Build
        run: go build ./...

      - name: Test and Coverage (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./.github/workflows/scripts/test_and_coverage.sh

      - name: Test (macOS/Windows)
        if: matrix.os != 'ubuntu-latest'
        run: go test -timeout 15m ./internal/core/vectorindex/...
