name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Git LFS
        if: matrix.os == 'ubuntu-latest'
        run: |
          git lfs install
          git lfs pull

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', '**/*.go') }}
          restore-keys: |
            go-build-${{ runner.os }}-

      - name: Verify Go version
        run: go version

      - name: Check Formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./.github/workflows/scripts/check-fmt.sh

      - name: Build
        run: go build ./...

      - name: Test and Coverage (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./.github/workflows/scripts/test_and_coverage.sh

      - name: Test (macOS/Windows)
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: |
          # -v prints each case's execution time. Show just the result lines for
          # readability, but dump the full log (with assertion detail) on failure.
          set -o pipefail
          go test -v -timeout 15m ./internal/core/vectorindex/... 2>&1 | tee vitest.log \
            | grep -E '^(ok|FAIL|--- (PASS|FAIL):|panic:)'
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then echo "===== full test log ====="; cat vitest.log; fi
          rm -f vitest.log
          exit "$status"

  ab-gate-timing:
    name: AB gate timing (experiment, do not merge)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: current vs #69, same runner (interleaved)
        shell: bash
        run: |
          # Times vectorindex tests under coverage. current = this branch (with
          # the msync fixes); m69 = origin/main (#69, the slow versions). Same VM
          # => runner speed cancels; the difference is the code.
          run_cov() { go clean -testcache; t0=$(date +%s); go test -covermode=atomic -coverprofile=/tmp/cov.out ./internal/core/vectorindex/ >/dev/null 2>&1 || true; echo "$(($(date +%s)-t0))s"; }
          git fetch -q origin main
          git worktree add -q ../m69 origin/main
          echo "RESULT current_1=$(run_cov)"
          echo "RESULT m69_1=$( cd ../m69 && run_cov )"
          echo "RESULT current_2=$(run_cov)"
          echo "RESULT m69_2=$( cd ../m69 && run_cov )"
