name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Git LFS
        if: matrix.os == 'ubuntu-latest'
        run: |
          git lfs install
          git lfs pull

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', '**/*.go') }}
          restore-keys: |
            go-build-${{ runner.os }}-

      - name: Verify Go version
        run: go version

      - name: Check Formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./.github/workflows/scripts/check-fmt.sh

      - name: Build
        run: go build ./...

      - name: Test and Coverage (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./.github/workflows/scripts/test_and_coverage.sh

      - name: Test (macOS/Windows)
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: |
          # -v prints each case's execution time. Show only result lines, and
          # drop the 0.00s cases (noise) — keep all FAILs and the full log on
          # failure (with assertion detail).
          set -o pipefail
          go test -v -timeout 15m ./internal/core/vectorindex/... 2>&1 | tee vitest.log \
            | grep -E '^(ok|FAIL|--- (PASS|FAIL):|panic:)' | grep -vE '^--- PASS:.*\(0\.00s\)$'
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then echo "===== full test log ====="; cat vitest.log; fi
          rm -f vitest.log
          exit "$status"

  searchcore-coverage:
    name: Coverage (searchcore)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: go-cov (searchcore)
        # searchcore has its own go.mod, so the main gate's `go test ./...` never
        # reaches it. Run go-cov inside the module. Thresholds are a current
        # baseline: most packages are already 86–98%, but the `engine` package
        # (61%) and a few 0% functions (engine logic + invertedindex config
        # getters) keep it off the main-module bar — so per-package/func gating
        # is off for now and only TOTAL is gated (floor 85%, currently 87.6%) to
        # prevent regression. Tightening (engine tests → per-func 80%) is a
        # follow-up.
        working-directory: searchcore
        env:
          THRESHOLD_TOTAL: "85"
          THRESHOLD_PACKAGE: "0"
          THRESHOLD_FUNC: "0"
        run: go run github.com/codetreker/go-cov/cmd/go-cov@v0.1.1

