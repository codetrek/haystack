name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Git LFS
        if: matrix.os == 'ubuntu-latest'
        run: |
          git lfs install
          git lfs pull

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', '**/*.go') }}
          restore-keys: |
            go-build-${{ runner.os }}-

      - name: Verify Go version
        run: go version

      - name: Check Formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./.github/workflows/scripts/check-fmt.sh

      - name: Build
        run: go build ./...

      - name: Test and Coverage (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          ./.github/workflows/scripts/test_and_coverage.sh

      - name: Test (macOS/Windows)
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: |
          echo "RESULT OS=${{ runner.os }}"
          FAULT='Error|Fault|Crash|Kill9|Recovery|Replay|WAL|Checkpoint|Idmap|Remap|Grow|OutOfRange|Endian'
          echo "=== total time: fault subset (noise re-check vs prior run) ==="
          t0=$(date +%s); go test -count=1 -run "$FAULT" ./internal/core/vectorindex/ >/dev/null 2>&1; t1=$(date +%s)
          echo "RESULT RUN_ONLY_FAULT=$((t1-t0))s"
          echo "=== per-test timing (verbose), fault subset — sorted desc ==="
          go test -v -count=1 -run "$FAULT" ./internal/core/vectorindex/ 2>&1 \
            | grep -E '^--- (PASS|FAIL):' \
            | sed -E 's/^--- (PASS|FAIL): (Test[A-Za-z0-9_]+) \(([0-9.]+)s\)/PERTEST \3 \2/' \
            | sort -rn | head -40
